# Relaxed markdownlint configuration for internal docs and Copilot instructions.
# Optimized for LLM/agentic editing with minimal false positives.
# Rule names: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

MD013: false # Line length (too strict for pre-polished internal docs)
MD024: false # Duplicate headings (common in docs with sections like "Overview")
MD029: false # Ordered list item prefix (allow mixing 1. 1. 1. or 1. 2. 3.)
MD033: false # Inline HTML (needed for badges, alerts, etc.)
MD036: false # Emphasis as heading (common for "Pattern 1:", "Example:", "Note:" labels in internal docs)
MD040: false # Fenced code language (not all blocks have a standard language ID; too noisy for drafts)
MD041: false # First line should be top-level heading (not always needed in docs)
